<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090610">
  <title>Fractured Grid Character Creator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090610;
      color: #f7f3ff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 46%, rgba(92, 45, 133, .24), transparent 43%),
        radial-gradient(ellipse at 50% 100%, rgba(33, 14, 50, .32), transparent 58%),
        #090610;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }

    .status {
      position: fixed;
      z-index: 2;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      max-width: min(80vw, 360px);
      color: rgba(230, 217, 255, .74);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .bottom-ui {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + 50px);
      width: min(100% - 24px, 560px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .character-select {
      display: flex;
      justify-content: center;
      align-items: stretch;
      flex-wrap: wrap;
      gap: 7px;
      max-width: 100%;
      padding: 6px;
      border: 1px solid rgba(221, 201, 255, .2);
      border-radius: 22px;
      background: rgba(13, 8, 21, .78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
    }

    .character-button {
      min-height: 44px;
      min-width: 88px;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border: 1px solid transparent;
      border-radius: 15px;
      background: rgba(255, 255, 255, .035);
      color: rgba(247, 243, 255, .9);
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .character-button[aria-pressed="true"] {
      border-color: rgba(194, 128, 255, .62);
      background: rgba(133, 57, 194, .22);
      box-shadow: 0 0 18px rgba(169, 76, 255, .13);
    }

    .character-button.coming-soon {
      color: rgba(222, 212, 236, .58);
    }

    .character-name {
      font-size: 12px;
      line-height: 1.1;
      letter-spacing: .035em;
      white-space: nowrap;
    }

    .character-note {
      font-size: 9px;
      line-height: 1.1;
      letter-spacing: .04em;
      color: rgba(212, 193, 233, .52);
      white-space: nowrap;
    }

    .hint {
      padding: 9px 14px;
      border: 1px solid rgba(221, 201, 255, .2);
      border-radius: 999px;
      background: rgba(13, 8, 21, .74);
      color: rgba(247, 243, 255, .82);
      font-size: 12px;
      letter-spacing: .035em;
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    @media (max-width: 360px) {
      .bottom-ui {
        width: calc(100% - 14px);
        gap: 6px;
      }

      .character-select {
        gap: 4px;
        padding: 4px;
      }

      .character-button {
        min-width: 82px;
        padding-inline: 8px;
      }

      .character-name { font-size: 11px; }
      .hint { font-size: 11px; padding: 8px 12px; }
    }

    @media (min-width: 700px) {
      .status { top: 22px; left: 22px; }
      .bottom-ui {
        bottom: 22px;
        gap: 9px;
      }

      .character-select { gap: 9px; padding: 7px; }
      .character-button { min-width: 112px; padding-inline: 16px; }
      .character-name { font-size: 13px; }
      .character-note { font-size: 10px; }
      .hint { font-size: 13px; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="Interactive 3D anime character creator scene"></canvas>
  <div class="status" id="status">Fractured Grid · ECHO-7</div>

  <div class="bottom-ui">
    <nav class="character-select" aria-label="Character selection">
      <button class="character-button" type="button" data-character="echo7" aria-pressed="true">
        <span class="character-name">ECHO-7</span>
        <span class="character-note">Selected</span>
      </button>
      <button class="character-button coming-soon" type="button" data-character="trynix" aria-pressed="false">
        <span class="character-name">Trynix</span>
        <span class="character-note">Coming soon</span>
      </button>
      <button class="character-button coming-soon" type="button" data-character="create" aria-pressed="false">
        <span class="character-name">Create Your Own</span>
        <span class="character-note">Coming soon</span>
      </button>
    </nav>
    <div class="hint">Drag to spin · pinch or scroll to zoom</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
